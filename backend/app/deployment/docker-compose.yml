services:
  backend:
    build:
      context: ../..
      dockerfile: backend/app/deployment/Dockerfile.backend
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
      - ../../outputs:/app/outputs
      - ../../tools:/app/tools
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app/frontend
    depends_on:
      - backend
